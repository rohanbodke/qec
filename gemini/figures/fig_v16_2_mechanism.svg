<text x="1115" y="450" text-anchor="middle" font-size="12.0" font-weight="700" fill="#ffffff">0</text>
<text x="1069" y="486" text-anchor="middle" font-size="13.2" font-weight="700" fill="#047857">Vote → 0 (Clean!)</text>
<text x="1069" y="534" text-anchor="middle" font-size="11.5" font-weight="600" fill="#065f46">For V = 1: W ≤ 2 &lt; 5/2</text>
<text x="1069" y="551" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">erased in 1 step!</text>
<rect x="620" y="594" width="524" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="882" y="620" text-anchor="middle" font-size="13.0" font-weight="700" fill="#065f46">Why Contraction Directly Powers Fast Linear-Time Readout:</text>
<text x="882" y="643" text-anchor="middle" font-size="12.0" font-weight="600" fill="#374151">Each cell decodes independently with no global cluster search; W ≤ 2V</text>
<text x="882" y="663" text-anchor="middle" font-size="12.0" font-weight="600" fill="#374151">ensures 5-edge wall voting shrinks errors × 2/5 per cycle in O(N) time.</text>
