<text x="153" y="632" text-anchor="middle" font-size="12.0" font-weight="700" fill="#b91c1c">4 Violated Interior Seams (V = 4)</text>
<rect x="276" y="380" width="284" height="304" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="418" y="408" text-anchor="middle" font-size="13.0" font-weight="700" fill="#1e293b">Physical Meaning of Coarse Weight:</text>
<text x="418" y="432" text-anchor="middle" font-size="12.0" font-weight="600" fill="#374151">Flipping 1 coarse parent edge flips</text>
<text x="418" y="450" text-anchor="middle" font-size="12.0" font-weight="700" fill="#1e40af">all 5 sub-edges on that outer wall</text>
<text x="418" y="468" text-anchor="middle" font-size="11.6" font-weight="600" fill="#475569">(2 Sheet 0 + 2 Sheet 1 + 1 Bridge).</text>
<line x1="296" y1="486" x2="540" y2="486" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="418" y="510" text-anchor="middle" font-size="12.2" font-weight="600" fill="#374151">W flipped wall sub-edges represent</text>
<text x="418" y="530" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1e293b">coarse error progress = W / 5.</text>
<line x1="296" y1="548" x2="540" y2="548" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="418" y="574" text-anchor="middle" font-size="12.2" font-weight="600" fill="#374151">Worst case (flip entire Sheet 0):</text>
<text x="418" y="596" text-anchor="middle" font-size="12.2" font-weight="600" fill="#374151">W = 8 sub-edges vs. V = 4 seams</text>
<text x="418" y="626" text-anchor="middle" font-size="14.2" font-weight="700" fill="#047857">(W / 5) ÷ V = (8 / 5) ÷ 4 = 2 / 5</text>
<text x="418" y="658" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1e293b">174× smaller cell than scale-8</text>
