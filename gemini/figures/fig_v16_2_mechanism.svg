<text x="1020" y="110" text-anchor="middle" font-size="12.0" font-weight="700" fill="#9f1239">Cut 1 Bridge Arm (3-Arm T):</text>
<text x="1020" y="131" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">Opens unsealed hole between</text>
<text x="1020" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">sheets → loops thread gap</text>
<text x="1020" y="169" text-anchor="middle" font-size="11.8" font-weight="700" fill="#be123c">Torus qubits: 2 → 1,004 (τ → 0)</text>
<rect x="910" y="192" width="220" height="92" rx="7" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.3"/>
<text x="1020" y="212" text-anchor="middle" font-size="12.0" font-weight="700" fill="#9f1239">Cross X &amp; Z in One Step:</text>
<text x="1020" y="233" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">Incompatible corner checks</text>
<text x="1020" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">open weight-1 shortcuts</text>
<text x="1020" y="271" text-anchor="middle" font-size="11.8" font-weight="700" fill="#be123c">Qubits jump: 1 → 3 → 49 → 737</text>
