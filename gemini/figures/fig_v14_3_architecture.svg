<text x="1034" y="250" text-anchor="middle" font-size="12.2" font-weight="700" fill="#065f46">Crossing costs +ΔE energy</text>
<text x="1034" y="266" text-anchor="middle" font-size="12.0" font-weight="600" fill="#047857">→ Multiplies barrier each scale</text>
<rect x="18" y="308" width="560" height="326" rx="12" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="298" y="336" text-anchor="middle" font-size="15.5" font-weight="700">(b) Why a 2×2 Four-Arm Cross Shrinks Errors by 2 / 5</text>
<rect x="64" y="368" width="214" height="214" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3.0"/>
<text x="117" y="426" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1e40af">Sheet 0</text>
