<circle cx="278" cy="475" r="7.5" fill="#d97706" stroke="#ffffff" stroke-width="1.6"/>
<circle cx="171" cy="475" r="8.0" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.6"/>
<text x="171" y="358" text-anchor="middle" font-size="12.2" font-weight="700" fill="#1e3a8a">5 Sub-Edges per Outer Wall</text>
<text x="171" y="604" text-anchor="middle" font-size="12.4" font-weight="700" fill="#b91c1c">4 Violated Interior Seams (Red)</text>
<rect x="304" y="368" width="254" height="214" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="431" y="398" text-anchor="middle" font-size="13.2" font-weight="700" fill="#1e293b">Each Outer Wall Has 5 Parts:</text>
<text x="431" y="420" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2563eb">• 2 sub-edges on Sheet 0</text>
<text x="431" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">• 2 sub-edges on Sheet 1</text>
<text x="431" y="460" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">• 1 sub-edge on Bridge</text>
<line x1="324" y1="478" x2="538" y2="478" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="431" y="502" text-anchor="middle" font-size="12.6" font-weight="600" fill="#374151">Flipping Sheet 0 = 2/5 on 4 walls</text>
<text x="431" y="528" text-anchor="middle" font-size="14.0" font-weight="700" fill="#047857">Coarse / Fine = (8/5) ÷ 4 = 2/5</text>
<text x="431" y="558" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">174× smaller cell than scale-8</text>
<rect x="602" y="308" width="560" height="326" rx="12" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="882" y="336" text-anchor="middle" font-size="15.5" font-weight="700">(c) Why Cutting One Bridge Arm Destroys Protection</text>
