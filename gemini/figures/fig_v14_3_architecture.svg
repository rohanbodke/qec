<text x="755" y="518" text-anchor="middle" font-size="12.8" font-weight="700" fill="#b91c1c">Open</text>
<text x="755" y="535" text-anchor="middle" font-size="12.8" font-weight="700" fill="#b91c1c">Hole</text>
<text x="755" y="358" text-anchor="middle" font-size="12.2" font-weight="700" fill="#b91c1c">3-Arm T-Bridge (4th Arm Cut)</text>
<text x="755" y="604" text-anchor="middle" font-size="12.4" font-weight="700" fill="#991b1b">Unchecked Loop Threads Gap</text>
<rect x="888" y="368" width="254" height="214" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="1015" y="400" text-anchor="middle" font-size="13.2" font-weight="700" fill="#991b1b">What Goes Wrong:</text>
<text x="1015" y="428" text-anchor="middle" font-size="12.4" font-weight="600" fill="#374151">A 3-arm bridge ends mid-cell,</text>
<text x="1015" y="448" text-anchor="middle" font-size="12.4" font-weight="600" fill="#374151">leaving a gap between Sheet 0</text>
<text x="1015" y="468" text-anchor="middle" font-size="12.4" font-weight="600" fill="#374151">and Sheet 1 with no check.</text>
<line x1="908" y1="486" x2="1122" y2="486" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="1015" y="514" text-anchor="middle" font-size="13.4" font-weight="700" fill="#b91c1c">Spurious Qubits: 2 → 1,004</text>
<text x="1015" y="540" text-anchor="middle" font-size="12.4" font-weight="600" fill="#374151">Lifetime collapses to ~ 0;</text>
<text x="1015" y="560" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">4-arm cross is minimal</text>
</svg>
