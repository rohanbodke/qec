<text x="224" y="442" text-anchor="middle" font-size="11.2" font-weight="600" fill="#2563eb">(flipped)</text>
<text x="117" y="533" text-anchor="middle" font-size="12.8" font-weight="700" fill="#1e40af">Sheet 0</text>
<text x="117" y="549" text-anchor="middle" font-size="11.2" font-weight="600" fill="#2563eb">(flipped)</text>
