<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
<rect width="1180" height="500" fill="#ffffff"/>
<style>text { font-family: -apple-system, Helvetica, Arial, sans-serif; fill: #1f2937; }</style>
<text x="590" y="28" text-anchor="middle" font-size="16.5" font-weight="700">How 3D Welded Quantum Memories Work — and Three Geometric Design Limits</text>
<rect x="20" y="52" width="272" height="426" rx="10" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="156.0" y="78" text-anchor="middle" font-size="13.5" font-weight="700">(a) 3-Way Bridge Stops Free Walks</text>
<rect x="308" y="52" width="272" height="426" rx="10" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="444.0" y="78" text-anchor="middle" font-size="13.5" font-weight="700">(b) Compact 2×2 Cross (Works)</text>
<rect x="596" y="52" width="272" height="426" rx="10" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="732.0" y="78" text-anchor="middle" font-size="13.5" font-weight="700">(c) Pruned 3-Arm Bridge (Leaks)</text>
<rect x="884" y="52" width="272" height="426" rx="10" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1020.0" y="78" text-anchor="middle" font-size="13.5" font-weight="700">(d) Stretched Cubic Grid (Slow)</text>
<polygon points="42,290 198,290 256,242 100,242" fill="#dbeafe" fill-opacity="0.72" stroke="#2563eb" stroke-width="1.8"/>
<polygon points="42,182 198,182 256,134 100,134" fill="#dbeafe" fill-opacity="0.72" stroke="#2563eb" stroke-width="1.8"/>
<polygon points="122,290 122,182 180,134 180,242" fill="#fde68a" fill-opacity="0.80" stroke="#d97706" stroke-width="2.0"/>
<line x1="122" y1="182" x2="180" y2="134" stroke="#b45309" stroke-width="3.2"/>
<line x1="122" y1="290" x2="180" y2="242" stroke="#b45309" stroke-width="2.4" stroke-dasharray="4,3"/>
<circle cx="88" cy="162" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<line x1="98" y1="162" x2="138" y2="160" stroke="#dc2626" stroke-width="2.4"/>
<line x1="146" y1="158" x2="196" y2="154" stroke="#dc2626" stroke-width="2.4"/>
<line x1="146" y1="162" x2="152" y2="205" stroke="#dc2626" stroke-width="2.4"/>
<circle cx="203" cy="153" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="153" cy="212" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="78" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">2D Sheet 1</text>
<text x="74" y="310" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">2D Sheet 2</text>
<text x="216" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Bridge</text>
<text x="156" y="352" text-anchor="middle" font-size="11.8">Parallel 2D sheets are welded by</text>
<text x="156" y="371" text-anchor="middle" font-size="11.8">perpendicular bridges at all scales.</text>
<text x="156" y="390" text-anchor="middle" font-size="11.8">Crossing any 3-way seam forces</text>
<text x="156" y="409" text-anchor="middle" font-size="11.8">1 defect to split into 2 (costs +ΔE),</text>
<text x="156" y="428" text-anchor="middle" font-size="11.8">blocking free 2D error walks.</text>
<rect x="354" y="114" width="180" height="180" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.4"/>
<line x1="444.0" y1="114" x2="444.0" y2="294" stroke="#dc2626" stroke-width="5.0"/>
<line x1="354" y1="204.0" x2="534" y2="204.0" stroke="#dc2626" stroke-width="5.0"/>
<circle cx="444.0" cy="114" r="5.5" fill="#991b1b" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="444.0" cy="294" r="5.5" fill="#991b1b" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="354" cy="204.0" r="5.5" fill="#991b1b" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="534" cy="204.0" r="5.5" fill="#991b1b" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="444.0" cy="204.0" r="5.5" fill="#991b1b" stroke="#ffffff" stroke-width="1.3"/>
<text x="444.0" y="318" text-anchor="middle" font-size="12.0" font-weight="700" fill="#047857">All 4 bridge arms reach cell walls</text>
<text x="444" y="352" text-anchor="middle" font-size="11.8">Smallest uniform confining cell:</text>
<text x="444" y="371" text-anchor="middle" font-size="11.8">254 qubits (planar) or 508 (torus),</text>
<text x="444" y="390" text-anchor="middle" font-size="11.8">220× smaller than 8×8 layout.</text>
<text x="444" y="409" text-anchor="middle" font-size="11.8">Preserves encoded qubits across</text>
<text x="444" y="428" text-anchor="middle" font-size="11.8">cycles (106× gain at Cycle 2).</text>
<rect x="642" y="114" width="180" height="180" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.4"/>
<line x1="732.0" y1="114" x2="732.0" y2="204.0" stroke="#dc2626" stroke-width="5.0"/>
<line x1="642" y1="204.0" x2="822" y2="204.0" stroke="#dc2626" stroke-width="5.0"/>
<line x1="732.0" y1="204.0" x2="732.0" y2="294" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="5,5"/>
<circle cx="732.0" cy="218.0" r="22" fill="#fee2e2" fill-opacity="0.7" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="4,3"/>
<circle cx="732.0" cy="204.0" r="6.5" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<text x="732.0" y="318" text-anchor="middle" font-size="12.0" font-weight="700" fill="#b91c1c">Dangling end tears "buttonhole"</text>
<text x="732" y="352" text-anchor="middle" font-size="11.8">Stopping a bridge mid-cell opens</text>
<text x="732" y="371" text-anchor="middle" font-size="11.8">a hole between the two sheets.</text>
<text x="732" y="390" text-anchor="middle" font-size="11.8">Spawns O(N) unprotected qubits</text>
<text x="732" y="409" text-anchor="middle" font-size="11.8">(K jumps from 2 to 1,004) whose</text>
<text x="732" y="428" text-anchor="middle" font-size="11.8">lifetime collapses as 1/N.</text>
<rect x="910" y="145" width="26" height="110" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2.0"/>
<rect x="1102" y="145" width="26" height="110" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2.0"/>
<line x1="936" y1="200" x2="1102" y2="200" stroke="#374151" stroke-width="3.0"/>
<circle cx="950" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="973" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="996" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="1019" cy="200" r="6.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="1042" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="1065" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="1088" cy="200" r="4.8" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<line x1="966" y1="176" x2="1072" y2="176" stroke="#dc2626" stroke-width="2.2"/>
<polygon points="960,176 970,171 970,181" fill="#dc2626"/>
<polygon points="1078,176 1068,171 1068,181" fill="#dc2626"/>
<text x="1019" y="166" text-anchor="middle" font-size="11.8" font-weight="700" fill="#dc2626">ΔE = 0 free walk</text>
<text x="1019" y="290" text-anchor="middle" font-size="12.0" font-weight="700" fill="#374151">7-qubit wire on 3D cubic grid</text>
<text x="1020" y="352" text-anchor="middle" font-size="11.8">Routing on one 3D cubic grid (ℓ=8)</text>
<text x="1020" y="371" text-anchor="middle" font-size="11.8">turns each edge into a 7-qubit wire.</text>
<text x="1020" y="390" text-anchor="middle" font-size="11.8">Defects hop along wires for free,</text>
<text x="1020" y="409" text-anchor="middle" font-size="11.8">cutting lifetime 321× (56,312 qubits</text>
<text x="1020" y="428" text-anchor="middle" font-size="11.8">vs. 1,480 unstretched).</text>
</svg>
